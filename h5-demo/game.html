<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光子新年活动 - 互动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0e27;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
        }

        .page-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* 使用新的交互界面背景图 */
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 透明点击层 */
        .click-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .click-area {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            /* 调试用，可以取消注释看点击区域 */
            /* background: rgba(255, 0, 0, 0.3); */
        }

        /* 返回按钮 - 左上角 */
        .back-btn-area {
            left: 2%;
            width: 15%;
            height: 6%;
            top: 8%;
        }

        /* 操作指引按钮 - 底部 */
        .guide-btn-area {
            left: 20%;
            width: 60%;
            height: 6%;
            top: 88%;
        }

        /* ========== 操作指引弹窗 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .guide-modal {
            width: 90%;
            max-width: 360px;
            background: linear-gradient(180deg, #1e3a6e 0%, #0d1a3a 100%);
            border: 2px solid rgba(100, 180, 255, 0.5);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .guide-title {
            text-align: center;
            font-size: 20px;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(100, 180, 255, 0.3);
        }

        .guide-content {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            line-height: 1.8;
        }

        .guide-step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid rgba(100, 180, 255, 0.6);
        }

        .step-number {
            background: linear-gradient(135deg, #4A9EFF, #2563EB);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .step-text {
            flex: 1;
        }

        .gesture-demo {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .gesture-item {
            text-align: center;
            flex: 1;
        }

        .gesture-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .gesture-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .tips-section {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
        }

        .tips-title {
            color: #FFD700;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .tips-title::before {
            content: "💡";
            margin-right: 6px;
        }

        .tips-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 使用新的交互界面背景图 -->
        <img src="assets/交互界面.png" alt="光子新年互动界面" class="bg-image">
        
        <!-- 透明点击层 -->
        <div class="click-layer">
            <div class="click-area back-btn-area" id="backBtn"></div>
            <div class="click-area guide-btn-area" id="guideBtn"></div>
        </div>
    </div>

    <!-- 操作指引弹窗 -->
    <div class="modal-overlay" id="guideModal">
        <div class="guide-modal">
            <button class="modal-close" onclick="closeGuideModal()">×</button>
            <h3 class="guide-title">🎮 操作指引</h3>
            <div class="guide-content">
                <div class="guide-step">
                    <div class="step-number">1</div>
                    <div class="step-text">
                        <strong>允许摄像头权限</strong><br>
                        点击浏览器弹出的摄像头权限请求，选择"允许"
                    </div>
                </div>
                
                <div class="guide-step">
                    <div class="step-number">2</div>
                    <div class="step-text">
                        <strong>调整手部位置</strong><br>
                        将手掌放在摄像头前方，确保手部完整显示在画面中
                    </div>
                </div>
                
                <div class="guide-step">
                    <div class="step-number">3</div>
                    <div class="step-text">
                        <strong>使用手势控制</strong><br>
                        通过不同手势来控制闪电形态变化
                    </div>
                </div>

                <div class="gesture-demo">
                    <div class="gesture-item">
                        <span class="gesture-icon">✋</span>
                        <div class="gesture-label">张开手掌<br>分散宇宙</div>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-icon">✊</span>
                        <div class="gesture-label">握拳<br>汇聚闪电</div>
                    </div>
                </div>

                <div class="tips-section">
                    <div class="tips-title">温馨提示</div>
                    <div class="tips-text">
                        • 确保光线充足，避免逆光<br>
                        • 手势动作要清晰明确<br>
                        • 如遇问题，请刷新页面重试
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 返回按钮
        document.getElementById('backBtn').addEventListener('click', function() {
            window.history.back();
        });

        // 操作指引按钮
        document.getElementById('guideBtn').addEventListener('click', function() {
            document.getElementById('guideModal').classList.add('active');
        });

        // 关闭操作指引弹窗
        function closeGuideModal() {
            document.getElementById('guideModal').classList.remove('active');
        }

        // 点击弹窗外部关闭
        document.getElementById('guideModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeGuideModal();
            }
        });

        // ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeGuideModal();
            }
        });
    </script>
</body>
</html>
