<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加载中 - 光子新年活动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0e27;
        }

        .page-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        /* Loading 进度条容器 */
        .loading-container {
            position: absolute;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loading-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
            letter-spacing: 2px;
        }

        /* 进度条外框 */
        .progress-bar-outer {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        /* 进度条内部 */
        .progress-bar-inner {
            width: 0%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(180deg, rgba(30, 58, 138, 0.8) 0%, rgba(23, 37, 84, 0.9) 100%);
            border: 2px solid rgba(96, 165, 250, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .back-btn::before {
            content: '';
            width: 12px;
            height: 12px;
            border-left: 3px solid #fff;
            border-bottom: 3px solid #fff;
            transform: rotate(45deg) translateX(2px);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <img src="assets/loading-page.png" alt="Loading" class="bg-image">
        
        <!-- Loading 进度条 -->
        <div class="loading-container">
            <span class="loading-text" id="loadingText">Loading... 0%</span>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- 返回按钮 -->
    <div class="back-btn" onclick="window.location.href='index.html'"></div>

    <script>
        let progress = 0;
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');
        
        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 8) + 3;
            if (progress >= 100) {
                progress = 100;
                loadingText.textContent = `Loading... ${progress}%`;
                progressBar.style.width = `${progress}%`;
                clearInterval(interval);
                
                // 进度满后跳转到交互页面
                setTimeout(() => {
                    window.location.href = 'game.html';
                }, 500);
            } else {
                loadingText.textContent = `Loading... ${progress}%`;
                progressBar.style.width = `${progress}%`;
            }
        }, 300);
    </script>
</body>
</html>
